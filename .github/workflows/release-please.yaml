on:
  push:
    branches:
      - main
name: release-please
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@d1a8f221d7723166f48a584aebba00ef3f6febec # v4.1.4
        with:
          release-type: node
          package-name: release-please-action
          extra-files: |
                        Addons~/io.conix.arena.renderfusion-urp/package.json
                        Addons~/io.conix.arena.renderfusion-hdrp/package.json
